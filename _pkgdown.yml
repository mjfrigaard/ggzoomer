url: https://mjfrigaard.github.io/fmggp2/

template:
  bootstrap: 5
  light-switch: false
  bslib:
    bg: "#0D0221"
    fg: "#E0E0FF"
    primary: "#FF2A6D"
    secondary: "#05D9E8"
    success: "#39FF14"
    info: "#05D9E8"
    warning: "#FFE600"
    danger: "#FF2A6D"
    link-color: "#05D9E8"
    link-hover-color: "#39FF14"
    navbar-bg: "#1A0B3B"
    code-bg: "#1A0B3B"
    code-color: "#39FF14"
    pre-bg: "#130630"
    border-color: "#FF2A6D"
    base_font: {google: "Space Mono"}
    heading_font: {google: "VT323"}
    code_font: {google: "Space Mono"}
    font-size-base: "0.95rem"
    headings-color: "#FF2A6D"

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]

reference:
- title: Themes
  contents:
  - theme_airfryer
  - theme_asmr
  - theme_axolotl
  - theme_boba
  - theme_capybara
  - theme_cleangirl
  - theme_coastal
  - theme_coquette
  - theme_cottagecore
  - theme_darkacademia
  - theme_digicam
  - theme_doomscroll
  - theme_fidget
  - theme_frog
  - theme_frutigeraero
  - theme_goblincore
  - theme_gorpcore
  - theme_groupchat
  - theme_indiesleaze
  - theme_kidcore
  - theme_ledstrip
  - theme_lightstick
  - theme_liminal
  - theme_livestream
  - theme_matcha
  - theme_mermaidcore
  - theme_mushroomlamp
  - theme_photodump
  - theme_pickleball
  - theme_plushie
  - theme_rgbsetup
  - theme_ringlight
  - theme_slime
  - theme_speedrun
  - theme_streak
  - theme_synthwave
  - theme_thrift
  - theme_tumbler
  - theme_unboxing
  - theme_vaporwave
  - theme_vinyl
  - theme_voicenote
  - theme_weirdcore
  - theme_wiredbuds
  - theme_fmggp2
- title: Book helpers
  contents:
  - co_box
  - status
  - "`%nin%`"
- title: Fonts
  contents:
  - load_fmggp2_fonts
  - import_fmggp2_fonts
  - add_fonts
  - check_fonts
  - check_assets
  - list_fonts
  - font_path

articles:
- title: Articles
  navbar: ~
  contents:
  - themes
  - book-helpers
