url: https://mjfrigaard.github.io/ggzoomer/

template:
  bootstrap: 5
  light-switch: false
  bslib:
    bg: "#FCFAFE"
    fg: "#31283C"
    primary: "#4F18AD"
    secondary: "#B967FF"
    success: "#00A86B"
    info: "#4F18AD"
    warning: "#B9B857"
    danger: "#E0459F"
    link-color: "#4F18AD"
    link-hover-color: "#8A2BA8"
    navbar-bg: "#F5EEFB"
    code-bg: "#F5EEFB"
    code-color: "#4F18AD"
    pre-bg: "#F5EEFB"
    border-color: "#E2D8EC"
    base_font: {google: "Inter"}
    heading_font: {google: "Space Grotesk"}
    code_font: {google: "Space Mono"}
    font-size-base: "0.95rem"
    headings-color: "#4F18AD"

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]

reference:
- title: Themes
  contents:
  - theme_asmr
  - theme_boba
  - theme_cleangirl
  - theme_coastal
  - theme_coquette
  - theme_cottagecore
  - theme_darkacademia
  - theme_digicam
  - theme_doomscroll
  - theme_egirl
  - theme_frog
  - theme_goblincore
  - theme_gorpcore
  - theme_indiesleaze
  - theme_kidcore
  - theme_ledstrip
  - theme_liminal
  - theme_slime
  - theme_tumbler
  - theme_vaporwave
  - theme_vinyl
  - theme_weirdcore

articles:
- title: Articles
  navbar: ~
  contents:
  - themes
